[package]
name = "rn-gpui-haptic-feedback"
version = "0.1.0"
edition = "2021"

[dependencies]
rn-gpui-module = { version = "0.1" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSHapticFeedback"] }

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
