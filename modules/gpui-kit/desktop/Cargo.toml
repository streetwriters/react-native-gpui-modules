[package]
name = "rn-gpui-gpui-kit"
version = "0.9.0"
edition = "2021"

[features]
default = ["primitives", "inputs", "overlays", "data", "layout", "charts"]
primitives = []
inputs = []
overlays = []
data = []
layout = []
charts = []

[dependencies]
rn-gpui-module = "0.1"
react-native-gpui = "0.1"
# Only for DEP_RN_GPUI_CORE_RPATHS, which build.rs puts on the test binary rpath.
rn-gpui-sys = "0.1"
gpui = "0.2"
gpui-base = "=0.9.1"
gpui-component = { version = "=0.9.1", features = ["speech", "inspector", "syntect"] }
gpui-kit-assets = "=0.9.1"
chrono = "0.4"
regex = "1"
anyhow = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
rn-gpui-module-build = "0.1"
