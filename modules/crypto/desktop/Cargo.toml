[package]
name = "rn-gpui-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
rn-gpui-module = { version = "0.1" }
aes = "0.8"
aes-gcm = "0.10"
aes-kw = { version = "0.2", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
