[package]
name = "rn-gpui-system"
version = "0.1.0"
edition = "2021"

[dependencies]
rn-gpui-module = { version = "0.1" }
# Login items: a launch agent on macOS, the Run key on Windows, an autostart entry on Linux.
auto-launch = "0.6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Jump list: the COM shell interfaces.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[build-dependencies]
rn-gpui-module-build = { version = "0.1" }
