[package]
name = "gpui-kit-reference"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gpui = "0.2"
gpui_platform = { version = "0.1", features = ["font-kit", "test-support"] }
gpui-base = "=0.9.1"
gpui-component = "=0.9.1"
gpui-kit-assets = "=0.9.1"
serde_json = "1"
itertools = "0.13"
unindent = "0.2"
chrono = "0.4"
regex = "1"
rand = "0.8"
fake = { version = "2.10.0", features = ["dummy"] }
autocorrect = "2.14.2"
anyhow = "1"
gpui-shell = { version = "=0.9.1", default-features = false, features = ["quickjs", "components"] }
dirs = "5"
csv = "1"
async-channel = "2"
lsp-types = { version = "0.97", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
gpui-kit = { path = "kit-shim" }
reqwest_client = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }

[workspace]

[patch.crates-io]
gpui = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }
gpui_platform = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }
gpui-pre = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }
gpui-pre-macros = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }
gpui-pre-sum-tree = { git = "https://github.com/streetwriters/gpui-fast", rev = "af2bd3a" }
gpui-pre-platform = { path = "pre-platform-shim" }
