name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:versions
      - run: npm run test:unit

  rust:
    name: rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build nasm pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev libwayland-dev \
            libdbus-1-dev libudev-dev
      # MSVC cannot open a path of 260 characters or more, and the deepest
      # patched reanimated headers under the checkout's own target dir reach it.
      - name: Use a short target directory
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> "$env:GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npx react-native-gpui autolink
        working-directory: example
      - run: npm run test:rust

  clean-install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: npm ci --ignore-scripts
      - run: node scripts/ci/clean-install.mjs
